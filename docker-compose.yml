version: '3.8'

services:
  redis:
    image: "redis:alpine"
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  app:
    build: .
    ports:
      - "${HTTP_PORT}:${HTTP_PORT}"
      - "${SSH_PORT}:${SSH_PORT}"
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - HTTP_HOST=${HTTP_HOST}
      - HTTP_PORT=${HTTP_PORT}
      - SSH_HOST=${SSH_HOST}
      - SSH_PORT=${SSH_PORT}
    volumes:
      - ./log_files:/app/log_files

  celery:
    build: .
    command: celery -A celery_app.app worker --loglevel=info
    depends_on:
      - redis
    environment:
      - PYTHONPATH=/app
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./log_files:/app/log_files

volumes:
  redis_data:
